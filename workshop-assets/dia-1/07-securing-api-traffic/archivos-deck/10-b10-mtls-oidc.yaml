_format_version: '3.0'
ca_certificates:
- id: 11111111-1111-1111-1111-111111111111
  cert: ${{ env "DECK_MTLS_CA_CERT" }}
plugins:
- name: correlation-id
  config:
    header_name: x-correlation-id
    echo_downstream: true
    generator: uuid
services:
- name: mock
  url: http://httpbin-backend:9081/anything/mock
  plugins:
  - name: mtls-auth
    config:
      ca_certificates:
      - 11111111-1111-1111-1111-111111111111
      skip_consumer_lookup: false
      ssl_verify: true
      revocation_check_mode: SKIP
  - name: openid-connect
    config:
      issuer: ${{ env "DECK_KONNECT_AUTH_ISSUER" }}
      auth_methods:
      - bearer
      consumer_claim:
      - sub
      cache_tokens_salt: ${{ env "DECK_KONNECT_AUTH_CLIENT_ID" }}
      session_secret: ${{ env "DECK_KONNECT_AUTH_CLIENT_SECRET" }}
      ssl_verify: true
  - name: acl
    config:
      allow:
      - external
  routes:
  - name: mock-route
    paths:
    - /mock
    methods:
    - GET
    plugins:
    - name: response-transformer
      config:
        add:
          headers:
          - 'x-kong: true'
        remove:
          headers:
          - Via
- name: routes
  url: http://httpbin-backend:9081/anything/routes
  routes:
  - name: routes-route
    paths:
    - /routes
- name: get-test
  url: http://httpbin-backend:9081/anything/get
  routes:
  - name: get-route
    paths:
    - /get
    plugins:
    - name: request-transformer
      config:
        add:
          headers:
          - 'x-inter-env: lab'
consumers:
- username: App-External
  custom_id: ${{ env "DECK_KONNECT_AUTH_CLIENT_ID" }}
  acls:
  - group: external
  plugins:
  - name: rate-limiting
    config:
      minute: 20
      policy: local
- username: App-Internal
  acls:
  - group: internal
  plugins:
  - name: rate-limiting
    config:
      minute: 3
      policy: local
