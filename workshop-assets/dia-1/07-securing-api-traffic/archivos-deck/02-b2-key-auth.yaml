_format_version: "3.0"



services:
  - name: mock
    url: http://httpbin-backend:9081/anything/mock
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
    routes:
      - name: mock-route
        paths:
          - /mock
        methods:
          - GET

  - name: routes
    url: http://httpbin-backend:9081/anything/routes
    routes:
      - name: routes-route
        paths:
          - /routes

consumers:
  - username: App-External
    keyauth_credentials:
      - key: external-secret-123
  - username: App-Internal
    keyauth_credentials:
      - key: internal-secret-123
