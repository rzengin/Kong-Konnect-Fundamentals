version: '3.8'

services:
  httpbin-backend:
    image: mccutchen/go-httpbin
    container_name: httpbin-backend
    ports:
      - "9081:9081"
    environment:
      - PORT=9081
    restart: unless-stopped
    networks:
      - kong-workshop

  opa:
    image: openpolicyagent/opa:latest
    container_name: opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=debug"
      - "/policy.rego"
    volumes:
      - ./policy.rego:/policy.rego
    restart: unless-stopped
    networks:
      - kong-workshop

networks:
  kong-workshop:
    name: kong-workshop
    external: true
