_format_version: "3.0"
plugins:
- config:
    path: /tmp/kong-requests.log
    reopen: true
  name: file-log
- config:
    echo_downstream: true
    generator: uuid
    header_name: x-correlation-id
  name: correlation-id
services:
- name: mock
  routes:
  - name: mock-route
    paths:
    - /mock
  url: http://httpbin-backend:9081/anything/mock
- name: routes
  routes:
  - name: routes-route
    paths:
    - /routes
  url: http://httpbin-backend:9081/anything/routes
- name: customers
  routes:
  - name: customers-route
    paths:
    - /customers
  url: http://httpbin-backend:9081/anything/customers
- name: echo
  routes:
  - name: echo-route
    paths:
    - /echo
  url: http://httpbin-backend:9081/anything/echo
