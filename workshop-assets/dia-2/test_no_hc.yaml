_format_version: "3.0"
services:
  - name: mock-service
    host: mock-upstream
    path: /anything
    protocol: http
    routes:
      - name: mock-route
        paths:
          - /api/v1/mock
upstreams:
  - name: mock-upstream
    algorithm: round-robin
    targets:
      - target: httpbin-backend:9081
        weight: 100
      - target: kong-dp:8000
        weight: 100
