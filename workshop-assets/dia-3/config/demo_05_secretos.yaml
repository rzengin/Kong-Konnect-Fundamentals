# =============================================================================
# Día 3 · Demo (instructor) — claves de los LLMs comerciales en el vault de Konnect
#
# Config store + vault "llm-keys": el Data Plane resuelve {vault://llm-keys/<clave>}
# sin variables de entorno. Ninguna clave queda en el contenedor ni en el repositorio:
# los valores salen del entorno de quien ejecuta kongctl (perfil kong-env del
# instructor: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY).
# Se aplica ANTES que el resto (kc_deploy con WITH_CLOUD=1).
# Origen: kong/config/05-secretos.yaml del Demo Track AI Gateway 2.
# =============================================================================
ai_gateway_config_stores:
  - ref: llm-keys-store
    ai_gateway: !ref lab-ai-gw#id
    name: llm-keys-store
    display_name: llm-keys-store
    secrets:
      - ref: openai-auth-header        # header completo: "Bearer <clave>"
        ai_gateway_config_store: llm-keys-store
        key: openai-auth-header
        value: !secret {source: !env AIGW_OPENAI_AUTH_HEADER}
      - ref: anthropic-api-key
        ai_gateway_config_store: llm-keys-store
        key: anthropic-api-key
        value: !secret {source: !env AIGW_ANTHROPIC_API_KEY}
      - ref: gemini-api-key
        ai_gateway_config_store: llm-keys-store
        key: gemini-api-key
        value: !secret {source: !env AIGW_GEMINI_API_KEY}

ai_gateway_vaults:
  - ref: llm-keys
    ai_gateway: !ref lab-ai-gw#id
    name: llm-keys
    type: konnect
    description: Claves de los proveedores de LLM comerciales (demo del instructor)
    config:
      config_store_id: !ref llm-keys-store#id
