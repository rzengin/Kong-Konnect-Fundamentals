extra_css:
  - extra.css

theme:
  name: material
  features:
    - content.code.copy
  font:
    text: Inter
    code: Roboto Mono
  logo: public/kong-logomark-lime.svg
  favicon: public/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: teal

docs_dir: docs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md

  - Día 1 - Teórico (Devs & Ops):
    - DEV (45 min) Arquitectura y Setup: dia-1-teoria-y-demos/00-arquitectura-setup/Guia_00_Arquitectura_y_Setup.md
