_format_version: "3.0"
services:
  - name: mock-b2b
    url: http://httpbin-backend:9081/anything/b2b
    routes:
      - name: b2b-route
        paths:
          - /api/v1/b2b
    plugins:
      - name: hmac-auth
        config:
          enforce_headers: ["date"]
          algorithms: ["hmac-sha256"]

consumers:
  - username: b2b-app
    hmacauth_credentials:
      - username: "banco-b"
        secret: "secreto-bancario"
