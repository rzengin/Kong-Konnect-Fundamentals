name: Docs (build estricto, enlaces y deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build estricto + chequeo de enlaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependencias
        run: pip install -r requirements-docs.txt

      # Se construye bajo _site/<repo>/ para que los enlaces absolutos
      # (/Kong-Konnect-Fundamentals/...) resuelvan con --root-dir _site.
      - name: mkdocs build --strict
        run: mkdocs build --strict --site-dir "_site/${{ github.event.repository.name }}"

      - name: Chequeo de enlaces internos (lychee offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir "${{ github.workspace }}/_site"
            '_site/**/*.html'
          fail: true
          jobSummary: true

  deploy:
    name: Deploy a GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependencias
        run: pip install -r requirements-docs.txt

      - name: Configurar identidad git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: mkdocs gh-deploy
        run: mkdocs gh-deploy --force --strict
